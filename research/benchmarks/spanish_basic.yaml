name: spanish_basic
language: es
description: >
  Basic Spanish verb conjugation covering five common verbs
  across core tenses and grammatical persons.

constraint_sets:
  - keyword: comer
    expected_form: comimos
    translation: to eat
    tense: preterite
    person: 1st
    number: plural

  - keyword: vivir
    expected_form: vivirá
    translation: to live
    tense: future
    person: 3rd
    number: singular

  - keyword: hablar
    expected_form: hablas
    translation: to speak
    tense: present
    person: 2nd
    number: singular

  - keyword: escribir
    expected_form: escribieron
    translation: to write
    tense: preterite
    person: 3rd
    number: plural

  - keyword: correr
    expected_form: corro
    translation: to run
    tense: present
    person: 1st
    number: singular
