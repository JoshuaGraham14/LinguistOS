name: spanish_basic_grid
language: es
description: >
  spanish_basic verbs (comer, vivir, hablar, escribir, correr) crossed with a
  10-cell balanced morphological grid: 3 present, 3 future, 2 preterite,
  1 imperfect, 1 conditional. All six (person, number) combinations are
  covered. 5 verbs × 10 cells = 50 constraint sets, all CEFR A1, for paired
  baseline / form-injected evaluation on the small-model ladder.

constraint_sets:
  # ───────────────────── comer ──────────────────────
