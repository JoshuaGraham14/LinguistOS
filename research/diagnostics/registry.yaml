# Diagnostic registry — rigorous, frequency-validated runs for the thesis.
#
# Diagnostics are numbered independently of the original exploratory
# "Experiment 1–10" series. A diagnostic may subsume, replace, or
# diverge from an old experiment number; see ``related_experiments``.
#
# Diagnostic 1 is a paired series on the same manifest:
#   1A — production (generate one form)
#   1B — verification (judge a proposed form, yes/no)
#
# Diagnostic 2 is paradigm isolation on the same 150 Spanish verbs:
#   2A — full-paradigm production (six-person tables + participle)
#   2B — single-slot production (one form per call)
#
# Diagnostic 3 is sentence binding on the same 150 verbs (paired to 2A):
#   3A — plain-text sentence, 2A-aligned hints (T=0, 1 sample)
#   3B — production baseline prompt (planned)
#   3C — production prompt + T=0.7, 10 samples (planned)
#
# Experiments (historical): exploratory spikes, LLM-labelled stimuli,
#   documented under docs/experiment-results/.
# Diagnostics (this file): final diagnosis runs — census manifest,
#   frozen cutoffs, reproducible seeds — feeding the build phase.

diagnostics:
  - id: diagnostic_1
    number: 1
    title: Cross-language morphology isolation
    question: >-
      On frequency-validated EN/ES verbs, can small Qwen models handle
      verb morphology in isolation (produce and verify forms), and does
      accuracy vary by corpus frequency and irregularity?
    manifest: research/evaluation/lexicon/experiment_verbs/manifest_diagnostic_1_n25.csv
    variants: [diagnostic_1a, diagnostic_1b]
    related_experiments: [1, 2, "1B", "2B"]
    status: in_progress

  - id: diagnostic_1a
    number: "1A"
    series: diagnostic_1
    title: Cross-language morphology isolation (production)
    question: >-
      Can small Qwen models produce correct verb forms in isolation, and
      does accuracy vary by corpus frequency and irregularity? Is there a
      language gap at matched structural cells (EN vs ES)?
    script: research/prototyping/diagnostic_1_freq_validated_isolation_qwen_spike.py
    manifest: research/evaluation/lexicon/experiment_verbs/manifest_diagnostic_1_n25.csv
    results: docs/spike-results/eval_diagnostic_1_n25_isolation_qwen_results.json
    models: [Qwen/Qwen3-0.6B, Qwen/Qwen3-1.7B, Qwen/Qwen3-4B]
    related_experiments: [1, 2, "1B", "2B"]
    status: complete

  - id: diagnostic_1b
    number: "1B"
    series: diagnostic_1
    title: Cross-language morphology isolation (verification)
    question: >-
      Can the model verify whether a proposed form is correct even when
      production fails (paired yes/no judge on the same manifest cells)?
    script: research/prototyping/diagnostic_1b_morphology_verification_qwen_spike.py
    manifest: research/evaluation/lexicon/experiment_verbs/manifest_diagnostic_1_n25.csv
    results: docs/spike-results/eval_diagnostic_1b_n25_verification_qwen_results.json
    models: [Qwen/Qwen3-0.6B, Qwen/Qwen3-1.7B, Qwen/Qwen3-4B]
    related_experiments: []
    status: complete

  - id: diagnostic_2
    number: 2
    title: Spanish paradigm recall vs sentence binding
    question: >-
      For Spanish verbs on the manifest, does the model know the form in
      isolation (paradigm or single-slot) but fail to bind it in sentence
      generation?
    script: research/prototyping/diagnostic_2_spanish_paradigm_qwen_spike.py
    manifest: research/evaluation/lexicon/experiment_verbs/manifest_diagnostic_2_paradigm_n150.csv
    variants: [diagnostic_2a, diagnostic_2b]
    related_experiments: [3, "3B", 10]
    status: complete

  - id: diagnostic_2a
    number: "2A"
    series: diagnostic_2
    title: Spanish paradigm production (full table)
    question: >-
      Can the model produce full six-person Spanish paradigms (plus
      participle) for census-validated verbs, and does accuracy vary by
      model size, tense, person, and frequency?
    script: research/prototyping/diagnostic_2_spanish_paradigm_qwen_spike.py
    probe_mode: diagnostic_2a
    manifest: research/evaluation/lexicon/experiment_verbs/manifest_diagnostic_2_paradigm_n150.csv
    results: docs/spike-results/eval_diagnostic_2a_n150_paradigm_qwen_results.json
    models: [Qwen/Qwen3-0.6B, Qwen/Qwen3-1.7B, Qwen/Qwen3-4B]
    related_experiments: [3, "3B", 10]
    status: complete

  - id: diagnostic_2b
    number: "2B"
    series: diagnostic_2
    title: Spanish paradigm production (single slot)
    question: >-
      Can the model produce one Spanish verb form at a time when asked
      directly (every person × tense), on the same verbs as Diagnostic 2A?
    script: research/prototyping/diagnostic_2_spanish_paradigm_qwen_spike.py
    probe_mode: diagnostic_2b
    manifest: research/evaluation/lexicon/experiment_verbs/manifest_diagnostic_2_paradigm_n150.csv
    results: docs/spike-results/eval_diagnostic_2b_n150_single_slot_qwen_results.json
    models: [Qwen/Qwen3-0.6B, Qwen/Qwen3-1.7B, Qwen/Qwen3-4B]
    related_experiments: [3, "3B", 10]
    status: complete

  - id: diagnostic_3
    number: 3
    title: Spanish sentence binding vs paradigm recall
    question: >-
      On the same 150 verbs and morphological cells as Diagnostic 2A, does
      the model use the required surface form in sentence generation when
      it already produced that form correctly in the paradigm table?
    script: research/prototyping/diagnostic_3_spanish_sentence_qwen_spike.py
    manifest: research/evaluation/lexicon/experiment_verbs/manifest_diagnostic_2_paradigm_n150.csv
    variants: [diagnostic_3a, diagnostic_3b, diagnostic_3c]
    related_experiments: [3, "3B", 10]
    status: in_progress

  - id: diagnostic_3a
    number: "3A"
    series: diagnostic_3
    title: Spanish sentence binding (2A-aligned hints, plain text)
    question: >-
      With plain-text output, 2A-aligned tense/person hints, no length band,
      no JSON, and no CEFR, does sentence pass rate lag 2A strict slot recall
      (binding gap)?
    script: research/prototyping/diagnostic_3_spanish_sentence_qwen_spike.py
    variant: diagnostic_3a
    manifest: research/evaluation/lexicon/experiment_verbs/manifest_diagnostic_2_paradigm_n150.csv
    compare_to: docs/spike-results/eval_diagnostic_2a_n150_paradigm_qwen_results.json
    results: docs/spike-results/eval_diagnostic_3a_n150_sentence_qwen_results.json
    models: [Qwen/Qwen3-0.6B, Qwen/Qwen3-1.7B, Qwen/Qwen3-4B]
    decoding: {temperature: 0, samples_per_cell: 1}
    related_experiments: [3, "3B", 10]
    status: ready

  - id: diagnostic_4
    number: 4
    title: Prompt ablation on frequency-validated benchmarks
    question: >-
      Does explicit prompting rescue binding on the new basic/challenging
      YAMLs built from the manifest?
    script: null
    manifest: research/evaluation/lexicon/experiment_verbs/manifest_diagnostic_1_n25.csv
    results: null
    related_experiments: [4, 5]
    status: planned
